---
name: App Inventory
description: Return a JSON array of app names from the apps directory

outputs:
  apps:
    description: App Inventory
    value: ${{ steps.inventory.outputs.apps }}

runs:
  using: composite
  steps:
    - name: App Inventory
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      id: inventory
      with:
        script: |-
          const fs = require('fs');
          const path = require('path');
          const appsDirectory = path.resolve(process.cwd(), 'apps');
          try {
              const entries = fs.readdirSync(appsDirectory, { withFileTypes: true });
              const apps = entries
                  .filter((entry) => entry.isDirectory())
                  .map((entry) => entry.name)
                  .sort();
              core.setOutput('apps', JSON.stringify(apps));
          } catch (error) {
              core.setFailed(`Error reading directory ${appsDirectory}: ${error.message}`);
          }
