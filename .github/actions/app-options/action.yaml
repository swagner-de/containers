---
name: App Options
description: Extract version, source, platforms, and build revision from an app

inputs:
  app:
    description: App Name
    required: true

outputs:
  platforms:
    description: Platforms
    value: ${{ steps.options.outputs.platforms }}
  source:
    description: Source
    value: ${{ steps.options.outputs.source }}
  version:
    description: Version
    value: ${{ steps.options.outputs.version }}
  build:
    description: Build revision (commits since the version last changed)
    value: ${{ steps.options.outputs.build }}
  dynamic:
    description: Whether the app resolves its version dynamically (empty VERSION + resolve-version.sh)
    value: ${{ steps.options.outputs.dynamic }}

runs:
  using: composite
  steps:
    - name: App Options
      id: options
      shell: bash
      run: |-
        APP_DIR="./apps/${{ inputs.app }}"
        PLATFORMS=$(\
            docker buildx bake --file "${APP_DIR}/docker-bake.hcl" image-all --print --progress=quiet \
                | jq --raw-output --compact-output '.target."image-all".platforms' \
        )
        SOURCE=$(\
            docker buildx bake --file "${APP_DIR}/docker-bake.hcl" --list type=variables,format=json --progress=quiet \
                | jq --raw-output '.[] | select(.name == "SOURCE") | .value' \
        )
        BAKE_VERSION=$(\
            docker buildx bake --file "${APP_DIR}/docker-bake.hcl" --list type=variables,format=json --progress=quiet \
                | jq --raw-output '.[] | select(.name == "VERSION") | .value' \
        )
        DYNAMIC=false
        if [ -z "${BAKE_VERSION}" ] && [ -x "${APP_DIR}/resolve-version.sh" ]; then
            DYNAMIC=true
        fi
        VERSION=$(./.github/scripts/app-version.sh "${APP_DIR}")
        BUILD=$(./.github/scripts/app-build.sh "${APP_DIR}")

        echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
        echo "source=${SOURCE}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "build=${BUILD}" >> $GITHUB_OUTPUT
        echo "dynamic=${DYNAMIC}" >> $GITHUB_OUTPUT
