---
name: App Options
description: Extract version, source, and platforms from an app's docker-bake.hcl

inputs:
  app:
    description: App Name
    required: true

outputs:
  platforms:
    description: Platforms
    value: ${{ steps.options.outputs.platforms }}
  source:
    description: Source
    value: ${{ steps.options.outputs.source }}
  version:
    description: Version
    value: ${{ steps.options.outputs.version }}

runs:
  using: composite
  steps:
    - name: App Options
      id: options
      shell: bash
      run: |-
        APP_DIR="./apps/${{ inputs.app }}"
        PLATFORMS=$(\
            docker buildx bake --file "${APP_DIR}/docker-bake.hcl" image-all --print --progress=quiet \
                | jq --raw-output --compact-output '.target."image-all".platforms' \
        )
        SOURCE=$(\
            docker buildx bake --file "${APP_DIR}/docker-bake.hcl" --list type=variables,format=json --progress=quiet \
                | jq --raw-output '.[] | select(.name == "SOURCE") | .value' \
        )
        VERSION=$(./.github/scripts/app-version.sh "${APP_DIR}")

        echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
        echo "source=${SOURCE}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
