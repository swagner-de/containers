---
name: App Versions
description: Parse an upstream version string into semver components

inputs:
  upstream-version:
    description: Upstream Version
    required: true
  build:
    description: Build revision number
    required: false
    default: "0"

outputs:
  is-valid-semver:
    description: If version is valid semantic versioning
    value: ${{ steps.versions.outputs.is-valid-semver }}
  semantic:
    description: Semantic Version
    value: ${{ steps.versions.outputs.semantic }}
  raw:
    description: Raw Version
    value: ${{ steps.versions.outputs.raw }}
  full:
    description: Full version including any release suffix (e.g. -rN)
    value: ${{ steps.versions.outputs.full }}
  upstream:
    description: Upstream Version
    value: ${{ steps.versions.outputs.upstream }}
  revision:
    description: Semantic version with build revision suffix (X.Y.Z-bN)
    value: ${{ steps.versions.outputs.revision }}
  is-first-build:
    description: Whether this is the first build of the version (build == 0)
    value: ${{ steps.versions.outputs.is-first-build }}

runs:
  using: composite
  steps:
    - name: Create package.json
      shell: bash
      run: |-
        cat > /tmp/semver-package.json << 'EOF'
        { "dependencies": { "semver": "^7.7.2" } }
        EOF

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Install semver
      shell: bash
      run: cd /tmp && cp semver-package.json package.json && npm install --silent

    - name: App Versions
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      id: versions
      env:
        UPSTREAM_VERSION: ${{ inputs.upstream-version }}
        BUILD: ${{ inputs.build }}
      with:
        script: |-
          const semver = require('/tmp/node_modules/semver');

          function sanitize(version) {
              return version.replace(/^v/, '').split('-')[0];
          }

          function calver() {
              const now = new Date();
              return `${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()}`;
          }

          const upstreamVersion = process.env.UPSTREAM_VERSION;
          const build = parseInt(process.env.BUILD, 10) || 0;
          const strictSemverRegex = /^v?(\d+(\.\d+)?(\.\d+)?)/;

          const parsedVersion = strictSemverRegex.exec(upstreamVersion);
          const isValidSemver = parsedVersion !== null;
          const parsedSemver = isValidSemver ? semver.coerce(parsedVersion[0], { loose: true }) : null;
          const semanticVersion = isValidSemver
              ? `${parsedSemver.major}.${parsedSemver.minor}.${parsedSemver.patch}`
              : calver();
          const rawVersion = isValidSemver ? sanitize(upstreamVersion) : upstreamVersion;
          // Full version keeps any release suffix (e.g. Alpine's -rN in dynamic
          // apps like samba: "4.23.8-r0"). This is the immutable-tag key and the
          // base for the build revision, so an apk-only rebuild (r0 -> r1) with
          // an unchanged base image produces a new tag instead of overwriting.
          const fullVersion = upstreamVersion.replace(/^v/, '');

          core.setOutput('is-valid-semver', isValidSemver);
          core.setOutput('semantic', semanticVersion);
          core.setOutput('raw', rawVersion);
          core.setOutput('full', fullVersion);
          core.setOutput('upstream', upstreamVersion);
          core.setOutput('revision', `${fullVersion}-b${build}`);
          core.setOutput('is-first-build', build === 0);
