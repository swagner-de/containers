---
name: README Generation

on:
  push:
    branches:
      - main
    paths:
      - apps/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate READMEs
        run: |
          # Generate per-app READMEs
          for app_dir in apps/*/; do
            [[ ! -f "$app_dir/docker-bake.hcl" ]] && continue
            app_name=$(basename "$app_dir")

            VERSION=$(./.github/scripts/app-version.sh "$app_dir")
            BUILD=$(./.github/scripts/app-build.sh "$app_dir")
            REVISION="${VERSION#v}-b${BUILD}"
            SOURCE=$(\
                docker buildx bake --file "$app_dir/docker-bake.hcl" --list type=variables,format=json --progress=quiet \
                    | jq --raw-output '.[] | select(.name == "SOURCE") | .value' \
            )
            PLATFORMS=$(\
                docker buildx bake --file "$app_dir/docker-bake.hcl" image-all --print --progress=quiet \
                    | jq --raw-output '.target."image-all".platforms | join(", ")' \
            )
            DESCRIPTION=$(\
                docker buildx bake --file "$app_dir/docker-bake.hcl" --list type=variables,format=json --progress=quiet \
                    | jq --raw-output '.[] | select(.name == "DESCRIPTION") | .value' \
            )
            DESC_BLOCK=""
            [ -n "$DESCRIPTION" ] && DESC_BLOCK=$'\n'"${DESCRIPTION}"$'\n'

            cat > "$app_dir/README.md" << EOF
          # ${app_name}
          ${DESC_BLOCK}
          | | |
          |---|---|
          | **Version** | \`${VERSION}\` |
          | **Revision** | \`${REVISION}\` |
          | **Source** | [${SOURCE}](${SOURCE}) |
          | **Platforms** | ${PLATFORMS} |
          | **Image** | \`ghcr.io/${{ github.repository }}/${app_name}\` |

          ## Usage

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}/${app_name}:${REVISION}
          \`\`\`

          ## Verify attestation

          \`\`\`bash
          gh attestation verify --repo ${{ github.repository }} oci://ghcr.io/${{ github.repository }}/${app_name}:rolling
          \`\`\`
          EOF
          done

          # Generate root README app table
          {
            echo "# Containers"
            echo ""
            echo "Container images built and published to GHCR."
            echo ""
            echo "## Images"
            echo ""
            echo "All images are rootless (UID 65534), multi-arch, scanned daily, and signed with GitHub attestations."
            echo ""
            echo "| App | Version | Revision | Source | Platforms |"
            echo "|-----|---------|----------|--------|-----------|"

            for app_dir in apps/*/; do
              [[ ! -f "$app_dir/docker-bake.hcl" ]] && continue
              app_name=$(basename "$app_dir")

              VERSION=$(./.github/scripts/app-version.sh "$app_dir")
              BUILD=$(./.github/scripts/app-build.sh "$app_dir")
              REVISION="${VERSION#v}-b${BUILD}"
              SOURCE=$(\
                  docker buildx bake --file "$app_dir/docker-bake.hcl" --list type=variables,format=json --progress=quiet \
                      | jq --raw-output '.[] | select(.name == "SOURCE") | .value' \
              )
              PLATFORMS=$(\
                  docker buildx bake --file "$app_dir/docker-bake.hcl" image-all --print --progress=quiet \
                      | jq --raw-output '.target."image-all".platforms | join(", ")' \
              )

              echo "| [\`${app_name}\`](apps/${app_name}) | \`${VERSION}\` | \`${REVISION}\` | [Source](${SOURCE}) | ${PLATFORMS} |"
            done

            echo ""
            echo "## Usage"
            echo ""
            echo '```bash'
            echo 'docker pull ghcr.io/${{ github.repository }}/<app>:<tag>'
            echo '```'
            echo ""
            echo "## Adding a new app"
            echo ""
            echo "See [CONTRIBUTING.md](CONTRIBUTING.md)."
          } > README.md

      - name: Commit updated READMEs
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard -- 'apps/*/README.md' README.md)" ]; then
            echo "READMEs are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/*/README.md README.md
            git commit -m "docs: regenerate READMEs"
            git push
          fi
